<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חניונים בתל אביב</title>
<meta name="description" content="מפת חניונים בתל אביב-יפו (אחוזות החוף, סנטרל פארק, גרין פרקינג) עם מחיר משוער לשעה וליום שבחרתם, תפוסה בזמן אמת והטבות.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css">
<style>
  :root { --bg: #fff; --fg: #1c1c1c; --muted: #666; --line: #ddd; --accent: #0b63ce; --chip: #f1f3f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.4 system-ui, "Segoe UI", Arial, sans-serif; color: var(--fg); background: var(--bg); }
  #bar { position: fixed; inset: 0 0 auto 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #bar form { flex: 1 1 220px; display: flex; }
  #q { flex: 1; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #bar button, #bar select, #bar input[type=datetime-local] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: inherit; }
  #bar button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
  #opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #opts > * { flex: none; }
  #bar label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  #map { position: fixed; inset: 0; }
  #panel, #list { position: fixed; z-index: 2; top: var(--bar-h, 56px); bottom: 0; left: 0; width: min(400px, 100%); overflow: auto;
    background: var(--bg); border-right: 1px solid var(--line); padding: 14px 16px; }
  #list { right: 0; left: auto; border-right: 0; border-left: 1px solid var(--line); padding: 0; }
  #list ol { list-style: none; margin: 0; padding: 0; }
  #list button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #list button:hover, #list button:focus-visible { background: var(--chip); }
  .price { font-weight: 700; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 13px; }
  h2 { margin: 0 0 2px; font-size: 20px; }
  .big { font-size: 28px; font-weight: 700; margin: 10px 0 2px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 13px; background: var(--chip); }
  .free { background: #d3f2dc; } .few { background: #ffe8b3; } .full, .closed { background: #ffd2d2; }
  .warn { background: #fff4d6; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .deal { background: #e6f4ff; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  pre { white-space: pre-wrap; font: inherit; background: var(--chip); padding: 8px 10px; border-radius: 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .links a, .links button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--accent); background: var(--bg); cursor: pointer; }
  #close { float: left; font-size: 22px; line-height: 1; border: 0; background: none; cursor: pointer; padding: 0 4px; }
  #legend { position: fixed; z-index: 1; bottom: 24px; right: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-inline: 6px 3px; }
  @media (max-width: 700px) {
    #bar { gap: 6px; padding: 6px 8px; } #bar form { flex-basis: 100%; }
    #opts { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; }
    #panel, #list { top: auto; left: 0; right: 0; width: 100%; max-height: 62vh; border: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px #0002; }
    #legend { bottom: auto; top: calc(var(--bar-h, 56px) + 8px); }
  }
</style>
</head>
<body>
<header id="bar">
  <form id="search" role="search"><input id="q" type="search" placeholder="לאן? מקום או כתובת, למשל דיזנגוף 50" aria-label="חיפוש מקום או כתובת"></form>
  <div id="opts">
  <div role="group" aria-label="מתי">
    <button type="button" data-when="now">עכשיו</button>
    <button type="button" data-when="tonight">הערב</button>
    <button type="button" data-when="fri">שישי</button>
    <button type="button" data-when="sat">שבת</button>
  </div>
  <input id="when" type="datetime-local" aria-label="שעת כניסה">
  <select id="dur" aria-label="משך החניה">
    <option value="60">שעה</option><option value="120" selected>שעתיים</option><option value="180">3 שעות</option>
    <option value="240">4 שעות</option><option value="480">8 שעות</option><option value="720">12 שעות</option><option value="1440">יממה</option>
  </select>
  <label><input type="checkbox" id="res"> תושב/ת ת״א</label>
  <label title="פנגו או סלו + נסיעה באוטובוס בת״א באותו יום"><input type="checkbox" id="bus"> פנגו/סלו + אוטובוס</label>
  <label title="מחיר מוזל בחניוני סנטרל פארק למשלמים באפליקציה שלהם"><input type="checkbox" id="cp"> אפליקציית סנטרל פארק</label>
  <button type="button" id="listBtn" aria-pressed="false" aria-controls="list">רשימה לפי מחיר</button>
  </div>
</header>
<main id="map" aria-label="מפת חניונים"></main>
<aside id="panel" hidden aria-live="polite"></aside>
<section id="list" hidden aria-label="חניונים לפי מחיר"><ol></ol></section>
<div id="legend" aria-hidden="true">
  <i style="background:#1a9850"></i>עד ₪20<i style="background:#a6d96a"></i>עד ₪40<i style="background:#fdae61"></i>עד ₪80<i style="background:#d73027"></i>יותר<i style="background:#66c2a5"></i>חינם? (לא מאומת)<i style="background:#9e9e9e"></i>לפי שילוט
</div>
<script type="module" src="app.js"></script>
</body>
</html>
