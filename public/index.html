<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חניונים בתל אביב</title>
<meta name="description" content="מפת חניונים בתל אביב-יפו (אחוזות החוף, סנטרל פארק, גרין פרקינג) עם מחיר משוער לשעה וליום שבחרתם, תפוסה בזמן אמת והטבות.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=block,calendar_today,chevron_left,chevron_right,close,directions,directions_bus,format_list_bulleted,home,info,link,local_offer,map,schedule,search,smartphone,timer&display=block">
<style>
  /* Google Maps feel: floating white cards over a colourful map; Google's four colours carry meaning (price band, status, chip). */
  :root {
    --blue: #1a73e8; --red: #d93025; --yellow: #fbbc04; --green: #188038; --orange: #fa7b17;
    --ink: #202124; --muted: #5f6368; --line: #dadce0; --paper: #fff; --hover: #f1f3f4;
    --blue-bg: #e8f0fe; --blue-fg: #1967d2; --green-bg: #e6f4ea; --green-fg: #137333;
    --red-bg: #fce8e6; --red-fg: #c5221f; --yellow-bg: #fef7e0; --yellow-fg: #b06000;
    --shadow: 0 1px 2px rgba(60, 64, 67, .3), 0 2px 6px 2px rgba(60, 64, 67, .15);
    --font: "Heebo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.5 var(--font); color: var(--ink); background: #e8eaed; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  a { color: var(--blue-fg); }
  .ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal;
    text-transform: none; white-space: nowrap; direction: ltr; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; display: inline-block; }

  /* floating search + chips; the bar itself lets the map through */
  #bar { position: fixed; inset: 0 0 auto; z-index: 3; display: flex; align-items: center; gap: 8px 12px; padding: 12px 12px 4px; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #search { flex: 0 1 400px; display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 8px 0 4px;
    background: var(--paper); border-radius: 24px; box-shadow: var(--shadow); }
  #search:focus-within { box-shadow: 0 1px 3px rgba(60, 64, 67, .3), 0 4px 8px 3px rgba(60, 64, 67, .15); }
  .logo { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--blue); color: #fff;
    font: 700 20px/1 var(--font); text-decoration: none; }
  #q { flex: 1; min-width: 0; height: 100%; font-size: 16px; padding: 0 10px; border: 0; background: none; }
  #q:focus { outline: none; }
  .icon-btn { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn .ms { font-size: 24px; }
  .icon-btn.go { color: var(--blue); }
  #listBtn[aria-pressed=true] { background: var(--blue-bg); color: var(--blue-fg); }

  #opts { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 4px 8px; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--paper);
    box-shadow: var(--shadow); font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; cursor: pointer; }
  .chip:hover { background: var(--hover); }
  .chip .ms { font-size: 18px; color: var(--k, var(--blue)); }
  .chip input, .chip select { border: 0; background: none; padding: 0; font-weight: 500; font-size: 14px; cursor: pointer; }
  .chip input:focus, .chip select:focus { outline: none; }
  .chip:has(:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .res { --k: var(--green); --kb: var(--green-bg); --kf: var(--green-fg); }
  .bus { --k: var(--red); --kb: var(--red-bg); --kf: var(--red-fg); }
  .cpa { --k: var(--orange); --kb: var(--yellow-bg); --kf: var(--yellow-fg); }
  .chip[aria-pressed=true], .tog:has(input:checked) { background: var(--kb, var(--blue-bg)); color: var(--kf, var(--blue-fg)); }
  .tog:has(input:checked) .ms { font-variation-settings: "FILL" 1; }
  /* when: "now / enter at" chip, then time and date chips with step arrows (after Google Maps) */
  #at { display: contents; }
  #at[hidden] { display: none; }
  .step { gap: 2px; padding: 0 4px; cursor: default; }
  .step:hover { background: var(--paper); }
  .step button { display: flex; align-items: center; gap: 6px; height: 28px; min-width: 28px; justify-content: center; padding: 0 4px; border: 0; border-radius: 14px; background: none; cursor: pointer; }
  .step button:hover { background: var(--hover); }
  .step .arr .ms { color: var(--muted); }
  #time::-webkit-calendar-picker-indicator { display: none; }
  #date { position: absolute; bottom: 0; width: 1px; height: 1px; padding: 0; opacity: 0; pointer-events: none; }
  .sep { flex: none; width: 1px; height: 20px; background: rgba(60, 64, 67, .25); }

  /* price pill: map pins, list rows, legend; the board is its big sibling. Colour = price band, dashed = unverified, blue P = per the sign */
  .plate, .board { --c: var(--blue); --on: #fff; }
  .plate { position: relative; display: inline-grid; place-items: center; min-width: 40px; height: 28px; padding: 0 10px;
    border: 2px solid #fff; border-radius: 14px; background: var(--c); color: var(--on); font: 700 14px/1 var(--font); white-space: nowrap; box-shadow: var(--shadow); }
  .t1 { --c: var(--green); --on: #fff; } .t2 { --c: var(--yellow); --on: var(--ink); } .t3 { --c: var(--orange); --on: var(--ink); } .t4 { --c: var(--red); --on: #fff; }
  .unv { --on: var(--green-fg); background: var(--paper); border: 2px dashed var(--green); }
  .pin { padding-bottom: 7px; cursor: pointer; }
  .pin:hover, .pin:has(.sel) { z-index: 5; }
  .pin .plate::before { content: ""; position: absolute; z-index: -1; top: calc(100% - 4px); left: 50%; width: 9px; height: 9px; margin-left: -4.5px;
    background: var(--c); border: 2px solid #fff; border-top: 0; border-left: 0; transform: rotate(45deg); }
  .pin .plate.unv::before { background: var(--paper); border-color: var(--green); border-style: dashed; }
  .plate.off { opacity: .45; }
  .pin .plate.sign { min-width: 26px; height: 26px; padding: 0; border-radius: 8px; font-size: 15px; }
  .plate.sel { box-shadow: 0 0 0 3px var(--ink), var(--shadow); }
  .plate .live { position: absolute; top: -5px; inset-inline-end: -5px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .live.free { background: #34a853; } .live.few { background: var(--yellow); } .live.full { background: #ea4335; } .live.closed { background: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .pin .plate { transition: transform .15s; transform-origin: 50% 100%; } }
  .pin .plate.sel, .pin:hover .plate { transform: scale(1.15); }
  /* zoomed out: pills shrink to coloured dots */
  .far .pin { padding-bottom: 0; }
  .far .pin .plate { top: 7px; min-width: 0; width: 14px; height: 14px; padding: 0; font-size: 0; border-radius: 50%; }
  .far .pin .plate::before, .far .plate .live { display: none; }
  .far .pin .plate.sign { top: 9px; width: 10px; height: 10px; border-width: 1.5px; border-radius: 3px; opacity: .7; }

  #map { position: fixed; inset: 0; }
  .maplibregl-ctrl-group { border-radius: 8px !important; box-shadow: var(--shadow) !important; }

  /* side card: list and lot details share the start side (right, in Hebrew) */
  #panel, #list { position: fixed; z-index: 2; top: var(--bar-h, 64px); bottom: 12px; inset-inline-start: 12px; width: min(400px, calc(100% - 24px));
    overflow: auto; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); }
  #panel { padding: 20px 24px 24px; }
  #list ol { list-style: none; margin: 0; padding: 0 0 8px; }
  #list .head { padding: 16px 20px 12px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }
  #list li > button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px;
    width: 100%; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  #list li > button:hover, #list li > button:focus-visible { background: var(--hover); }
  #list .plate { justify-self: start; box-shadow: none; }
  .row-name { display: block; font-weight: 500; }
  .row-sub, .row-end { font-size: 13px; color: var(--muted); }
  .row-end { text-align: end; white-space: nowrap; }
  .status { display: block; font-weight: 500; }
  .status.free { color: var(--green-fg); } .status.few { color: var(--yellow-fg); } .status.full, .status.closed { color: var(--red-fg); }

  /* lot details */
  #close { float: left; margin: -8px -12px 0 0; }
  h2 { margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .board { margin: 18px 0 14px; padding: 18px 20px 16px; border-radius: 16px; background: var(--c); color: var(--on); }
  .board-price { font: 700 52px/1 var(--font); letter-spacing: -1px; }
  .board-price.small { font-size: 32px; letter-spacing: 0; }
  .board-when { margin-top: 6px; font-size: 14px; opacity: .92; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; }
  .split div { padding: 10px 14px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; }
  .split b { display: block; font: 700 22px/1.2 var(--font); color: var(--ink); }
  .split .on { background: var(--blue-bg); border-color: transparent; color: var(--blue-fg); }
  .split .on b { color: var(--blue-fg); }
  .facts { margin: 0 0 12px; font-size: 14px; }
  .facts p { margin: 2px 0; }
  /* tonal callouts: blue = info, green = a deal that applies, yellow = a deal you could get, red = a restriction */
  .note { --b: var(--blue-bg); --f: var(--blue-fg); --i: "info"; display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; padding: 10px 14px;
    border-radius: 12px; background: var(--b); color: var(--f); font-size: 14px; }
  .note::before { content: var(--i); flex: none; font: 20px/1 "Material Symbols Rounded"; font-feature-settings: "liga"; margin-top: 1px; }
  .note.green { --b: var(--green-bg); --f: var(--green-fg); --i: "local_offer"; }
  .note.yellow { --b: var(--yellow-bg); --f: var(--yellow-fg); --i: "local_offer"; }
  .note.red { --b: var(--red-bg); --f: var(--red-fg); --i: "block"; }
  .actions { display: flex; gap: 16px; margin: 18px 0; padding: 14px 0; border-block: 1px solid var(--line); }
  .act { all: unset; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; font-size: 12px; font-weight: 500; color: var(--blue-fg); cursor: pointer; text-align: center; }
  .act .ms { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--blue-bg); font-size: 22px; }
  .act.primary .ms { background: var(--blue); color: #fff; }
  .act:hover .ms { filter: brightness(.94); }
  .act:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
  h3 { margin: 18px 0 6px; font-size: 15px; font-weight: 500; }
  pre { margin: 0; white-space: pre-wrap; font: 14px/1.6 var(--font); background: var(--hover); padding: 12px 14px; border-radius: 12px; }
  .fine { margin-top: 18px; font-size: 12px; color: var(--muted); }

  /* legend */
  #legend { position: fixed; z-index: 1; bottom: 24px; left: 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 12px; background: var(--paper); border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
  #legend .plate { height: 24px; min-width: 0; padding: 0 8px; font-size: 12px; box-shadow: none; }
  #legend .plate.sign { width: 24px; padding: 0; border-radius: 6px; }
  #legend .cap { margin-inline-end: 4px; }

  @media (max-width: 700px) {
    #bar { flex-wrap: wrap; padding: 8px 8px 0; }
    #search { flex: 1 1 100%; }
    #opts { flex-basis: 100%; margin: 0 -8px; padding: 2px 8px 8px; }
    #panel, #list { top: auto; bottom: 0; inset-inline: 0; width: 100%; max-height: 62vh; border-radius: 28px 28px 0 0;
      box-shadow: 0 -2px 10px rgba(60, 64, 67, .2); }
    #panel::before, #list::before { content: ""; display: block; width: 32px; height: 4px; margin: -8px auto 12px; border-radius: 2px; background: var(--line); }
    #list::before { margin: 10px auto 0; }
    #legend { bottom: auto; top: var(--bar-h, 104px); left: 8px; right: 8px; justify-content: center; padding: 6px 8px; gap: 4px; }
    #legend .cap { display: none; }
  }
</style>
</head>
<body>
<header id="bar">
  <form id="search" role="search">
    <a class="logo" href="/" aria-label="חניונים בתל אביב, לדף הראשי">P</a>
    <input id="q" type="search" placeholder="לאן נוסעים? למשל דיזנגוף 50" aria-label="חיפוש מקום או כתובת">
    <button type="submit" class="icon-btn go" aria-label="חיפוש"><span class="ms">search</span></button>
    <button type="button" class="icon-btn" id="listBtn" aria-pressed="false" aria-controls="list" aria-label="רשימת חניונים" title="רשימה"><span class="ms">format_list_bulleted</span></button>
  </form>
  <div id="opts">
    <label class="chip"><span class="ms">schedule</span><select id="mode" aria-label="מתי"><option value="now">עכשיו</option><option value="at">כניסה ב-</option></select></label>
    <div id="at" hidden>
      <span class="chip step">
        <button type="button" class="arr" data-step="-1" data-unit="time" aria-label="רבע שעה קודם"><span class="ms">chevron_right</span></button>
        <input id="time" type="time" aria-label="שעת כניסה">
        <button type="button" class="arr" data-step="1" data-unit="time" aria-label="רבע שעה אחרי"><span class="ms">chevron_left</span></button>
      </span>
      <span class="chip step" style="position: relative">
        <button type="button" class="arr" data-step="-1" data-unit="date" aria-label="יום קודם"><span class="ms">chevron_right</span></button>
        <button type="button" id="dateBtn" aria-label="בחירת תאריך"><span class="ms">calendar_today</span><span id="dateTxt"></span></button><input id="date" type="date" tabindex="-1" aria-hidden="true">
        <button type="button" class="arr" data-step="1" data-unit="date" aria-label="יום אחרי"><span class="ms">chevron_left</span></button>
      </span>
    </div>
    <label class="chip"><span class="ms">timer</span><select id="dur" aria-label="משך החניה">
      <option value="60">שעה</option><option value="120" selected>שעתיים</option><option value="180">3 שעות</option>
      <option value="240">4 שעות</option><option value="480">8 שעות</option><option value="720">12 שעות</option><option value="1440">יממה</option>
    </select></label>
    <span class="sep" aria-hidden="true"></span>
    <label class="chip tog res"><input type="checkbox" id="res"><span class="ms">home</span>תושב/ת ת״א</label>
    <label class="chip tog bus" title="פנגו או סלו + נסיעה באוטובוס בת״א באותו יום"><input type="checkbox" id="bus"><span class="ms">directions_bus</span>פנגו/סלו + אוטובוס</label>
    <label class="chip tog cpa" title="מחיר מוזל בחניוני סנטרל פארק למשלמים באפליקציה שלהם"><input type="checkbox" id="cp"><span class="ms">smartphone</span>אפליקציית סנטרל פארק</label>
  </div>
</header>
<main id="map" aria-label="מפת חניונים"></main>
<aside id="panel" hidden aria-live="polite"></aside>
<section id="list" hidden aria-label="חניונים לפי מחיר"><ol></ol></section>
<div id="legend" aria-hidden="true">
  <span class="cap">מחיר בש״ח לזמן שבחרתם</span>
  <span class="plate t1">עד 20</span><span class="plate t2">עד 40</span><span class="plate t3">עד 80</span><span class="plate t4">80+</span>
  <span class="plate t1 unv">חינם?</span><span class="plate sign">P</span><span>לפי השילוט</span>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
