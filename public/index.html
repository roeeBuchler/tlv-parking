<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חניונים בתל אביב</title>
<meta name="description" content="מפת חניונים בתל אביב-יפו (אחוזות החוף, סנטרל פארק, גרין פרקינג) עם מחיר משוער לשעה וליום שבחרתם, תפוסה בזמן אמת והטבות.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=Karantina:wght@700&display=swap">
<style>
  /* Taken from the street: the blue P sign, curb paint, asphalt. Prices are sign plates; everything else stays quiet. */
  :root {
    --sign: #1d4e9e; --asphalt: #2e3338; --concrete: #e9ebe8; --paper: #fff; --line: #d3d6d2; --muted: #5d6368;
    --curb-red: #b3122e; --t1: #217a3c; --t2: #8a6100; --t3: #c2410c; --t4: #a50e2d;
    --text: "IBM Plex Sans Hebrew", system-ui, sans-serif; --display: "Karantina", "IBM Plex Sans Hebrew", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.5 var(--text); color: var(--asphalt); background: var(--concrete); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--sign); outline-offset: 2px; }
  a { color: var(--sign); }

  /* header */
  #bar { position: fixed; inset: 0 0 auto; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 10px 14px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--asphalt); text-decoration: none; flex: none; }
  .brand-name { font: 700 27px/1 var(--display); padding-top: 3px; }
  #search { flex: 1 1 280px; display: flex; }
  #q { flex: 1; min-width: 0; font-size: 16px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); }
  #q:focus { border-color: var(--sign); outline: none; }
  #opts { display: flex; align-items: center; gap: 8px; width: 100%; overflow-x: auto; scrollbar-width: none; }
  #opts > * { flex: none; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-inline-start: 1px solid var(--line); background: var(--paper); padding: 6px 12px; cursor: pointer; }
  .seg button:first-child { border-inline-start: 0; }
  #when, #dur, #listBtn { padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); }
  .tog { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; white-space: nowrap; }
  .tog input { accent-color: var(--asphalt); margin: 0; }
  .seg button[aria-pressed=true], #listBtn[aria-pressed=true], .tog:has(input:checked) { background: var(--asphalt); border-color: var(--asphalt); color: #fff; }
  #listBtn { cursor: pointer; }

  /* the sign plate: map pins, list rows, legend, and (large) the price board */
  .plate { --c: var(--sign); position: relative; display: inline-grid; place-items: center; min-width: 42px; height: 31px; padding: 3px 8px 0;
    border: 0; border-radius: 5px; background: var(--c); color: #fff; font: 700 25px/1 var(--display); white-space: nowrap; }
  .plate::after, .board::after { content: ""; position: absolute; inset: 2px; border: 1.5px solid #fff; border-radius: 3px; pointer-events: none; }
  .unv::after { border-style: dashed !important; }
  .t1 { --c: var(--t1); } .t2 { --c: var(--t2); } .t3 { --c: var(--t3); } .t4 { --c: var(--t4); }
  .pin { padding-bottom: 7px; cursor: pointer; }
  .pin:hover, .pin:has(.sel) { z-index: 5; }
  .pin .plate::before { content: ""; position: absolute; top: 100%; left: 50%; width: 2px; height: 7px; margin-left: -1px; background: var(--asphalt); }
  .plate.off { opacity: .4; }
  /* no price list: a smaller plate, so priced lots stand out */
  .pin .plate.sign { min-width: 26px; height: 24px; padding: 2px 6px 0; font-size: 19px; }
  .plate.sel { outline: 2.5px solid var(--asphalt); outline-offset: 1px; }
  .plate .live { position: absolute; top: -5px; inset-inline-end: -5px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--paper); }
  .live.free { background: #1f9d48; } .live.few { background: #e0a100; } .live.full { background: var(--curb-red); } .live.closed { background: var(--asphalt); }
  @media (prefers-reduced-motion: no-preference) { .pin .plate { transition: transform .15s; transform-origin: 50% 100%; } }
  .pin .plate.sel { transform: scale(1.25); }
  /* zoomed out: plates shrink to coloured pips */
  .far .pin { padding-bottom: 0; }
  .far .pin .plate { top: 7px; min-width: 0; width: 14px; height: 14px; padding: 0; font-size: 0; border-radius: 3px; }
  .far .pin .plate::after { border-width: 1px; border-radius: 1px; }
  .far .pin .plate::before, .far .plate .live { display: none; }
  .far .pin .plate.sign { top: 9px; width: 9px; height: 9px; opacity: .6; }

  #map { position: fixed; inset: 0; }

  /* sheet: list and lot details share the start side (right, in Hebrew) */
  #panel, #list { position: fixed; z-index: 2; top: var(--bar-h, 60px); bottom: 0; inset-inline-start: 0; width: min(380px, 100%);
    overflow: auto; background: var(--paper); border-inline-end: 1px solid var(--line); }
  #panel { padding: 18px 20px 24px; }
  #list ol { list-style: none; margin: 0; padding: 0; }
  #list .head { padding: 12px 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }
  #list li > button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px;
    width: 100%; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #list li > button:hover, #list li > button:focus-visible { background: var(--concrete); }
  #list .plate { justify-self: start; }
  .row-name { display: block; font-weight: 500; }
  .row-sub, .row-end { font-size: 13px; color: var(--muted); }
  .row-end { text-align: end; white-space: nowrap; }
  .status { display: block; font-weight: 500; }
  .status.free { color: #1a7f3c; } .status.few { color: #8a6100; } .status.full, .status.closed { color: var(--curb-red); }

  /* lot details */
  #close { float: left; margin: -6px -8px 0 0; width: 36px; height: 36px; border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); }
  h2 { margin: 0; font-size: 21px; line-height: 1.3; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .board { position: relative; margin: 16px 0 12px; padding: 16px 18px 14px; border-radius: 8px; background: var(--c, var(--sign)); color: #fff; }
  .board::after { inset: 4px; border-width: 2px; border-radius: 5px; }
  .board-price { font: 700 68px/.85 var(--display); padding-top: 6px; }
  .board-price.small { font-size: 44px; }
  .board-when { margin-top: 8px; font-size: 14px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 6px; margin: 0 0 12px; }
  .split div { padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .split div + div { border-inline-start: 1.5px solid var(--line); }
  .split b { display: block; font: 700 28px/1.1 var(--display); color: var(--asphalt); }
  .split .on { background: var(--concrete); }
  .facts { margin: 0 0 12px; font-size: 14px; }
  .facts p { margin: 2px 0; }
  /* curb stripes: blue-white = information or a deal, red-white = a restriction */
  .note { --s: var(--sign); margin: 10px 0; padding: 9px 18px 9px 12px; font-size: 14px; background: repeating-linear-gradient(180deg, var(--s) 0 9px, #fff 9px 18px) right / 6px 100% no-repeat, #e3e6e2; }
  .note.red { --s: var(--curb-red); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
  .btn { padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--asphalt); text-decoration: none; cursor: pointer; font-weight: 500; }
  .btn.primary { background: var(--sign); border-color: var(--sign); color: #fff; }
  h3 { margin: 18px 0 6px; font-size: 15px; }
  pre { margin: 0; white-space: pre-wrap; font: 14px/1.6 var(--text); background: var(--concrete); padding: 10px 12px; border-radius: 6px; }
  .fine { margin-top: 18px; font-size: 13px; color: var(--muted); }

  /* legend */
  #legend { position: fixed; z-index: 1; bottom: 26px; left: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  #legend .plate { height: 26px; min-width: 0; font-size: 20px; padding: 2px 6px 0; }
  #legend .cap { color: var(--muted); margin-inline-end: 4px; }

  @media (max-width: 700px) {
    #bar { padding: 8px 10px; gap: 8px; }
    .brand-name { display: none; }
    #search { flex-basis: 0; }
    #panel, #list { top: auto; inset-inline: 0; width: 100%; max-height: 62vh; border: 0; border-top: 1px solid var(--line);
      border-radius: 12px 12px 0 0; box-shadow: 0 -6px 18px rgba(46, 51, 56, .18); }
    #legend { bottom: auto; top: calc(var(--bar-h, 96px) + 8px); left: 8px; right: 8px; padding: 6px 8px; gap: 4px; }
    #legend .cap { display: none; }
    #legend .plate { height: 23px; font-size: 17px; padding: 2px 5px 0; }
  }
</style>
</head>
<body>
<header id="bar">
  <a class="brand" href="/" aria-label="חניונים בתל אביב, לדף הראשי"><span class="plate sign" aria-hidden="true">P</span><span class="brand-name">חניונים בתל אביב</span></a>
  <form id="search" role="search"><input id="q" type="search" placeholder="לאן נוסעים? מקום או כתובת, למשל דיזנגוף 50" aria-label="חיפוש מקום או כתובת"></form>
  <button type="button" id="listBtn" aria-pressed="false" aria-controls="list">רשימה</button>
  <div id="opts">
    <div class="seg" role="group" aria-label="מתי">
      <button type="button" data-when="now">עכשיו</button>
      <button type="button" data-when="tonight">הערב</button>
      <button type="button" data-when="fri">שישי</button>
      <button type="button" data-when="sat">שבת</button>
    </div>
    <input id="when" type="datetime-local" aria-label="שעת כניסה">
    <select id="dur" aria-label="משך החניה">
      <option value="60">שעה</option><option value="120" selected>שעתיים</option><option value="180">3 שעות</option>
      <option value="240">4 שעות</option><option value="480">8 שעות</option><option value="720">12 שעות</option><option value="1440">יממה</option>
    </select>
    <label class="tog"><input type="checkbox" id="res"> תושב/ת ת״א</label>
    <label class="tog" title="פנגו או סלו + נסיעה באוטובוס בת״א באותו יום"><input type="checkbox" id="bus"> פנגו/סלו + אוטובוס</label>
    <label class="tog" title="מחיר מוזל בחניוני סנטרל פארק למשלמים באפליקציה שלהם"><input type="checkbox" id="cp"> אפליקציית סנטרל פארק</label>
  </div>
</header>
<main id="map" aria-label="מפת חניונים"></main>
<aside id="panel" hidden aria-live="polite"></aside>
<section id="list" hidden aria-label="חניונים לפי מחיר"><ol></ol></section>
<div id="legend" aria-hidden="true">
  <span class="cap">מחיר בש״ח לזמן שבחרתם</span>
  <span class="plate t1">עד 20</span><span class="plate t2">עד 40</span><span class="plate t3">עד 80</span><span class="plate t4">80+</span>
  <span class="plate t1 unv">חינם?</span><span class="plate sign">P</span><span>לפי השילוט</span>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
