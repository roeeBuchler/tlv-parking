# Push to main: test + deploy. Weekly (or manual): refresh data first, commit it, then test + deploy.
# A pipeline "problem" (new tariff template, price jump >50%, page layout change) fails the run,
# so GitHub emails the owner and nothing suspicious gets deployed.
name: data + deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * 0" }] # Sundays 06:00 Israel
  workflow_dispatch:
permissions: { contents: write }
concurrency: deploy
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refresh data
        if: github.event_name != 'push'
        run: npm run data
      - run: npm test
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: weekly refresh" && git push)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply tlv-parking --remote
            deploy
